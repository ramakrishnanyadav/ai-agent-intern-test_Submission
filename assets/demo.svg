<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; ry: 10px; }
      .header-bg { fill: #161b22; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; }
      .term-text { font-family: "Fira Code", "Courier New", Courier, monospace; font-size: 14px; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; }
      .out-key { fill: #79c0ff; }
      .out-val { fill: #a5d6ff; }
      .out-str { fill: #7ee787; }
      .out-success { fill: #56d364; font-weight: bold; }
      .out-source { fill: #ffa657; }

      @keyframes typing {
        0%, 15% { opacity: 0; }
        20%, 100% { opacity: 1; }
      }
      @keyframes step2 {
        0%, 45% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes step3 {
        0%, 75% { opacity: 0; }
        80%, 100% { opacity: 1; }
      }

      .step-1 { animation: typing 12s infinite; }
      .step-2 { animation: step2 12s infinite; }
      .step-3 { animation: step3 12s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect class="bg" width="900" height="480" />
  <path class="header-bg" d="M0,10 Q0,0 10,0 L890,0 Q900,0 900,10 L900,38 L0,38 Z" />

  <!-- Terminal Buttons -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" />
  <circle cx="40" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="450" y="24" text-anchor="middle" class="title">bash — Aster &amp; Row Autonomous RAG Support Agent (CLI Demo)</text>

  <!-- Step 1: CLI Order Lookup Query -->
  <g class="step-1" transform="translate(25, 65)">
    <text class="term-text">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">python cli.py --query "Where is ORD-1007?"</tspan>
    </text>
    <text class="term-text" y="26" fill="#8b949e">=======================================================</text>
    <text class="term-text" y="46">
      <tspan class="out-key">QUERY    : </tspan>
      <tspan class="cmd">Where is ORD-1007?</tspan>
    </text>
    <text class="term-text" y="66">
      <tspan class="out-key">STATUS   : </tspan>
      <tspan class="out-success">ANSWERED</tspan>
    </text>
    <text class="term-text" y="86">
      <tspan class="out-key">SOURCES  : </tspan>
      <tspan class="out-source">[]</tspan>
    </text>
    <text class="term-text" y="106" fill="#8b949e">-------------------------------------------------------</text>
    <text class="term-text" y="126">
      <tspan class="out-key">RESPONSE : </tspan>
      <tspan class="out-val">Order ORD-1007 is currently shipped. Carrier: UPS.</tspan>
    </text>
    <text class="term-text" y="146">
      <tspan class="out-val">           It is estimated to arrive on 2026-08-22.</tspan>
    </text>
    <text class="term-text" y="166" fill="#8b949e">=======================================================</text>
  </g>

  <!-- Step 2: Machine-Parseable JSON Output -->
  <g class="step-2" transform="translate(25, 260)">
    <text class="term-text">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">python cli.py --query "Can I get this shipped to Vietnam?" --json</tspan>
    </text>
    <text class="term-text" y="24" fill="#e6edf3">{</text>
    <text class="term-text" y="42" fill="#e6edf3">  <tspan class="out-key">"text"</tspan>: <tspan class="out-str">"Shipping to Vietnam is not available at this time."</tspan>,</text>
    <text class="term-text" y="60" fill="#e6edf3">  <tspan class="out-key">"sources"</tspan>: [<tspan class="out-source">"06-international-shipping.md"</tspan>],</text>
    <text class="term-text" y="78" fill="#e6edf3">  <tspan class="out-key">"status"</tspan>: <tspan class="out-str">"ANSWERED"</tspan></text>
    <text class="term-text" y="96" fill="#e6edf3">}</text>
  </g>

  <!-- Step 3: Evaluation Suite Pass -->
  <g class="step-3" transform="translate(25, 385)">
    <text class="term-text">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">python eval.py</tspan>
    </text>
    <text class="term-text" y="26">
      <tspan class="out-success">OVERALL SCORE : 56/56 (100.0%) — ZERO CRITICAL FAILURES</tspan>
    </text>
  </g>
</svg>
