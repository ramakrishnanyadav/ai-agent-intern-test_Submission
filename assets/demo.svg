<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 840" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; ry: 12px; }
      .header-bg { fill: #161b22; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; }
      .term-text { font-family: "Fira Code", "Courier New", Courier, monospace; font-size: 13.5px; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .out-key { fill: #79c0ff; font-weight: 500; }
      .out-val { fill: #a5d6ff; }
      .out-str { fill: #7ee787; }
      .out-success { fill: #56d364; font-weight: bold; }
      .out-refused { fill: #ff7b72; font-weight: bold; }
      .out-warn { fill: #ffa657; font-weight: bold; }
      .out-source { fill: #d2a8ff; font-style: italic; }
      .separator { stroke: #30363d; stroke-width: 1px; stroke-dasharray: 4,4; }

      @keyframes typingSequence {
        0%, 10% { opacity: 0; transform: translateY(5px); }
        15%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes seqStep2 { 0%, 22% { opacity: 0; } 27%, 100% { opacity: 1; } }
      @keyframes seqStep3 { 0%, 36% { opacity: 0; } 41%, 100% { opacity: 1; } }
      @keyframes seqStep4 { 0%, 50% { opacity: 0; } 55%, 100% { opacity: 1; } }
      @keyframes seqStep5 { 0%, 64% { opacity: 0; } 69%, 100% { opacity: 1; } }
      @keyframes seqStep6 { 0%, 78% { opacity: 0; } 83%, 100% { opacity: 1; } }
      @keyframes seqStep7 { 0%, 88% { opacity: 0; } 92%, 100% { opacity: 1; } }

      .anim-1 { animation: typingSequence 16s ease-in-out infinite; }
      .anim-2 { animation: seqStep2 16s ease-in-out infinite; }
      .anim-3 { animation: seqStep3 16s ease-in-out infinite; }
      .anim-4 { animation: seqStep4 16s ease-in-out infinite; }
      .anim-5 { animation: seqStep5 16s ease-in-out infinite; }
      .anim-6 { animation: seqStep6 16s ease-in-out infinite; }
      .anim-7 { animation: seqStep7 16s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect class="bg" width="920" height="840" />
  <path class="header-bg" d="M0,12 Q0,0 12,0 L908,0 Q920,0 920,12 L920,40 L0,40 Z" />

  <!-- Terminal Control Buttons -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />

  <!-- Terminal Window Title -->
  <text x="460" y="25" text-anchor="middle" class="title">bash — Aster &amp; Row Autonomous RAG Agent (Interactive Multi-Query Demo)</text>

  <!-- Example 1: Standard Policy Query -->
  <g class="anim-1" transform="translate(25, 65)">
    <text class="term-text">
      <tspan class="prompt">1. Customer Query: </tspan>
      <tspan class="cmd">python cli.py --query "What is the return window for standard items?"</tspan>
    </text>
    <text class="term-text" y="24">
      <tspan class="out-key">STATUS: </tspan><tspan class="out-success">ANSWERED</tspan>
      <tspan class="out-key">  | CITATION: </tspan><tspan class="out-source">[01-returns-policy-current.md]</tspan>
    </text>
    <text class="term-text" y="44">
      <tspan class="out-val">"Customers on the standard plan may request a return within 30 calendar days of delivery."</tspan>
    </text>
    <line x1="0" y1="58" x2="870" y2="58" class="separator" />
  </g>

  <!-- Example 2: Loyalty Membership Extension -->
  <g class="anim-2" transform="translate(25, 145)">
    <text class="term-text">
      <tspan class="prompt">2. Loyalty Query: </tspan>
      <tspan class="cmd">python cli.py --query "I have TrailPlus membership, do I get extra time?"</tspan>
    </text>
    <text class="term-text" y="24">
      <tspan class="out-key">STATUS: </tspan><tspan class="out-success">ANSWERED</tspan>
      <tspan class="out-key">  | CITATION: </tspan><tspan class="out-source">[09-trailplus-membership.md]</tspan>
    </text>
    <text class="term-text" y="44">
      <tspan class="out-val">"TrailPlus members enjoy an extended return window of 45 calendar days from delivery."</tspan>
    </text>
    <line x1="0" y1="58" x2="870" y2="58" class="separator" />
  </g>

  <!-- Example 3: Safe Order Lookup (PII Scrubbed) -->
  <g class="anim-3" transform="translate(25, 225)">
    <text class="term-text">
      <tspan class="prompt">3. Order Status: </tspan>
      <tspan class="cmd">python cli.py --query "Where is ORD-1007 and when will it arrive?"</tspan>
    </text>
    <text class="term-text" y="24">
      <tspan class="out-key">STATUS: </tspan><tspan class="out-success">ANSWERED</tspan>
      <tspan class="out-key">  | TOOL CALL: </tspan><tspan class="out-val">lookup_order('ORD-1007')</tspan>
    </text>
    <text class="term-text" y="44">
      <tspan class="out-val">"Order ORD-1007 is shipped via UPS. Estimated arrival: August 22, 2026. (PII Scrubbed)"</tspan>
    </text>
    <line x1="0" y1="58" x2="870" y2="58" class="separator" />
  </g>

  <!-- Example 4: PII Extraction Interception -->
  <g class="anim-4" transform="translate(25, 305)">
    <text class="term-text">
      <tspan class="prompt">4. PII Interception: </tspan>
      <tspan class="cmd">python cli.py --query "Can you give me the billing address and email for ORD-1001?"</tspan>
    </text>
    <text class="term-text" y="24">
      <tspan class="out-key">STATUS: </tspan><tspan class="out-refused">REFUSED</tspan>
      <tspan class="out-key">   | REASON: </tspan><tspan class="out-refused">PRIVACY_REFUSAL</tspan>
    </text>
    <text class="term-text" y="44">
      <tspan class="out-refused">"I cannot disclose confidential customer details, billing addresses, or email addresses."</tspan>
    </text>
    <line x1="0" y1="58" x2="870" y2="58" class="separator" />
  </g>

  <!-- Example 5: Unlisted Country Shipping (Machine-Parseable JSON) -->
  <g class="anim-5" transform="translate(25, 385)">
    <text class="term-text">
      <tspan class="prompt">5. International Intent: </tspan>
      <tspan class="cmd">python cli.py --query "Can I get this shipped to Vietnam?" --json</tspan>
    </text>
    <text class="term-text" y="24" fill="#e6edf3">{</text>
    <text class="term-text" y="42" fill="#e6edf3">  <tspan class="out-key">"text"</tspan>: <tspan class="out-str">"Shipping to Vietnam is not available. Aster &amp; Row currently ships only to Canada."</tspan>,</text>
    <text class="term-text" y="60" fill="#e6edf3">  <tspan class="out-key">"sources"</tspan>: [<tspan class="out-source">"06-international-shipping.md"</tspan>], <tspan class="out-key">"status"</tspan>: <tspan class="out-str">"ANSWERED"</tspan></text>
    <text class="term-text" y="78" fill="#e6edf3">}</text>
    <line x1="0" y1="92" x2="870" y2="92" class="separator" />
  </g>

  <!-- Example 6: Document Conflict Resolution -->
  <g class="anim-6" transform="translate(25, 495)">
    <text class="term-text">
      <tspan class="prompt">6. Policy Conflict: </tspan>
      <tspan class="cmd">python cli.py --query "Can I put the Breeze Tumbler in the dishwasher?"</tspan>
    </text>
    <text class="term-text" y="24">
      <tspan class="out-key">STATUS: </tspan><tspan class="out-warn">CONFLICT</tspan>
      <tspan class="out-key">  | SOURCES: </tspan><tspan class="out-source">[11-product-care.md, 12-breeze-tumbler-product-card.md]</tspan>
    </text>
    <text class="term-text" y="44">
      <tspan class="out-warn">"Official sources conflict: Care Guide requires hand-washing; Product Card says dishwasher safe."</tspan>
    </text>
    <line x1="0" y1="58" x2="870" y2="58" class="separator" />
  </g>

  <!-- Example 7: Unsupported Action Intent -->
  <g class="anim-7" transform="translate(25, 575)">
    <text class="term-text">
      <tspan class="prompt">7. Action Intent: </tspan>
      <tspan class="cmd">python cli.py --query "Please cancel my order ORD-1002 immediately"</tspan>
    </text>
    <text class="term-text" y="24">
      <tspan class="out-key">STATUS: </tspan><tspan class="out-warn">UNSUPPORTED_ACTION</tspan>
    </text>
    <text class="term-text" y="44">
      <tspan class="out-val">"I cannot process cancellations directly. I can explain our policy or connect you with support."</tspan>
    </text>
    <line x1="0" y1="58" x2="870" y2="58" class="separator" />
  </g>

  <!-- Example 8: Evaluation Suite Pass -->
  <g transform="translate(25, 655)">
    <text class="term-text">
      <tspan class="prompt">8. Reliability Evaluation Benchmark Suite: </tspan>
      <tspan class="cmd">python eval.py</tspan>
    </text>
    <rect x="0" y="15" width="870" height="42" fill="#161b22" rx="6" />
    <text class="term-text" y="41" x="15">
      <tspan class="out-success">✔ OVERALL EVALUATION SCORE : 56/56 (100.0%) PASS — 0 CRITICAL FAILURES</tspan>
    </text>
  </g>
</svg>
